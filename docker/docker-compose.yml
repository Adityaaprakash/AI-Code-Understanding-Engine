# docker/docker-compose.yml
# =============================================================================
# AI Code Understanding Engine — Primary Development Compose Services
# Includes PostgreSQL (with pgvector), FastAPI backend, and Background Worker
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codelens_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelens}
      POSTGRES_USER: ${POSTGRES_USER:-codelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codelens_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codelens} -d ${POSTGRES_DB:-codelens}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: codelens_backend_dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codelens}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-codelens}
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: codelens_worker_dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codelens}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-codelens}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  codelens_postgres_dev_data:
    driver: local
