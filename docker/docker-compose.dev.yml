# docker/docker-compose.dev.yml
# =============================================================================
# AI Code Understanding Engine — Development PostgreSQL service ONLY
# This is the TASK-1C minimal service. Full application compose is TASK-1F.
# =============================================================================
#
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml down
#   docker compose -f docker/docker-compose.dev.yml down -v   # also removes volume
#
# Credentials are read from .env in the repository root.
# Copy .env.example → .env and adjust before running.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codelens_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelens}
      POSTGRES_USER: ${POSTGRES_USER:-codelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codelens_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codelens} -d ${POSTGRES_DB:-codelens}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  codelens_postgres_dev_data:
    driver: local
