[project]
name = "ai-code-understanding-engine"
version = "0.1.0"
description = "AI Code Understanding Engine — CodeLens AI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# ──────────────────────────────────────────────────────────────────────────────
# Runtime dependencies
# These cover the full planned stack (FastAPI, DB, async worker).
# Modules that use them will be implemented in later tasks (1C, 1D, 5, 6, 7…).
# ──────────────────────────────────────────────────────────────────────────────
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Data validation and settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database — ORM + async driver
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # HTTP client (used in tests and future service-to-service calls)
    "httpx>=0.27.0",

    # AST Parsing
    "tree-sitter>=0.22.0",
    "tree-sitter-java>=0.21.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",

    # Linting and formatting
    "ruff>=0.4.0",

    # Type checking
    "mypy>=1.10.0",

    # SQLAlchemy stubs (provides typed stubs for mypy)
    "sqlalchemy[mypy]>=2.0.30",

    # FastAPI / Starlette type stubs
    "types-passlib",
]

# ──────────────────────────────────────────────────────────────────────────────
# Build system
# ──────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "code-analyzer/code_analyzer"]


# ──────────────────────────────────────────────────────────────────────────────
# Ruff — linting and formatting
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Enable a practical baseline: pycodestyle errors, pyflakes, isort, and a
# subset of pylint-style rules. Avoids rules that create friction on an
# empty codebase or require heavy annotation.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (move TYPE_CHECKING imports)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default args (FastAPI uses this)
    "SIM108", # ternary vs if-else — too opinionated for this codebase
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "code_analyzer", "retrieval", "graph", "llm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ──────────────────────────────────────────────────────────────────────────────
# mypy — static type checking
# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false

# Foundation settings — can be tightened incrementally
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

# Ignore missing stubs for third-party packages that don't ship them
# (SQLAlchemy async, asyncpg, etc.)
ignore_missing_imports = true

# Per-module overrides for external packages that have limited type info
[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "alembic.*",
]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: pure unit tests without external dependencies or database connections",
    "api: FastAPI application endpoints and HTTP route tests",
    "integration: cross-component or integration tests",
    "db: database tests requiring a live PostgreSQL connection",
]
filterwarnings = [
    "error",
    # pytest-asyncio emits a deprecation warning about fixture loop scope in some versions
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore::PendingDeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The Starlette TestClient is deprecated:DeprecationWarning",
]

# ──────────────────────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "experiments/*", "evaluation/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
